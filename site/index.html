<!doctype html>
<html lang="en" data-tone="navy">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/freewilly/logo.svg" />

    <!--
      The theme follows the OS, and a stored choice wins over it (S6). The design system's
      pre-paint script replaces the anchor below, inlined by vite.config.ts: the tokens are
      keyed off data-theme alone, so it states the OS preference too, before first paint.
    -->
    <!--theme-script-->

    <title>FreeWilly — Docker on Windows, without Docker Desktop</title>
    <meta
      name="description"
      content="A free Windows desktop app that installs upstream Moby into a WSL2 distribution it owns, serves the docker_engine pipe your existing tools already look for, and shows your containers in one window. Per-user install, no admin, nothing resident."
    />

    <!-- Google Analytics is not in this head: it loads only after the visitor allows it, from
         the banner in components/Consent.tsx (DD285). -->

    <!--
      scripts/prerender.mjs patches the title, description, canonical and og:url per route
      by replace-or-throw, and inlines the rendered body into the root element. og:image is
      DD49. Note: no closing head or script token may appear in a comment here, or the Vite
      asset injection and the prerender both anchor to it instead of the real one.
    -->

    <!-- Reveal-on-scroll starts at opacity 0 and is lifted by the client observer (S7).
         With no JS the prerendered text is still in the DOM; this makes it visible too. -->
    <noscript>
      <style>
        .reveal {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body class="vg-site">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
